name: ci-cd

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: mlops-challenge
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff
        run: ruff check .

      - name: Compile Python files
        run: python -m compileall inference_api ml mlops tests

  test:
    name: Unit and Contract Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build test image
        run: docker compose --profile tests build tests

      - name: Run pytest in Docker
        run: docker compose --profile tests run --rm tests

  build:
    name: Build Image
    runs-on: ubuntu-latest
    needs: test

    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}
      image_tag: ${{ steps.image.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image metadata
        id: image
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE_URI="${REGISTRY}/${OWNER_LC}/${IMAGE_NAME}"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            --tag "${{ steps.image.outputs.image_uri }}:${{ steps.image.outputs.image_tag }}" \
            --tag "${{ steps.image.outputs.image_uri }}:latest" \
            .

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image
        if: github.event_name == 'push'
        run: |
          docker push "${{ steps.image.outputs.image_uri }}:${{ steps.image.outputs.image_tag }}"
          docker push "${{ steps.image.outputs.image_uri }}:latest"
